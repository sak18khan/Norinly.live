services:
  - type: web
    name: norinly-backend
    env: node
    region: oregon # or singapore / frankfurt based on your target users
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false  # Set this manually in Render dashboard to your Vercel URL
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false  # Set this manually - path to your Firebase service account JSON
